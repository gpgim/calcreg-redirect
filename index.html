  // Leva o visitante para a página equivalente em cire.app.br.

    var mapa = {
      "": "", "index.html": "",
      "sobre": "sobre.html", "sobre.html": "sobre.html",

    var caminho = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();

    location.replace("https://cire.app.br/" + destino);

</script>
